# More option see https://github.com/DreamMaoMao/mango/wiki/

# Autostart
source = ~/.config/mango/autostart.conf

# Keybindings
source = ~/.config/mango/keybinds.conf

# Input Configs (Keyboard, Mouse, Trackpad)
source = ~/.config/mango/input.conf

# Window Apperance
source = ~/.config/mango/window.conf

# Animations
source = ~/.config/mango/animations.conf

# Layouts
source = ~/.config/mango/layouts.conf

