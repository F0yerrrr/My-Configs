### BEGIN_KITTY_THEME

# Alabaster Dark
include current-theme.conf


### BEGIN_KITTEN_CONF

# BEGIN_KITTY_FONTS
font_family      family="Monaspace Neon"
bold_font        auto
italic_font      auto
bold_italic_font auto

# BEGIN_KITTY_WINDOW
background_opacity 0.8

# BEGIN_KITTY_KEYBINDS
map Ctrl+t launch --type=tab
map Ctrl+w close_tab
map Ctrl+right next_tab
map Ctrl+left previous_tab
map alt+shift+t set_tab_title